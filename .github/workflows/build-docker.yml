name: 构建 Docker 镜像

on:
  push:
    branches: [main]
  workflow_dispatch:  # 手动触发（方便你随时重新构建）

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 查看磁盘空间
        run: df -h /

      - name: 构建 Docker 镜像
        run: |
          docker build -t meter-reading:1.0.0 .
          echo "✅ 镜像构建完成"

      - name: 导出为 .tar.gz
        run: |
          docker save meter-reading:1.0.0 | gzip > meter-reading-1.0.0.tar.gz
          ls -lh meter-reading-1.0.0.tar.gz

      - name: 上传到 Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meter-reading-docker-image
          path: meter-reading-1.0.0.tar.gz
          retention-days: 30  # 保留30天
